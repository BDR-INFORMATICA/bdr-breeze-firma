name: Verify signing tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node scripts/verify-manifest.test.mjs
      - run: python3 scripts/test-release-metadata.py
      - run: node --test scripts/repair-release-metadata.test.mjs
